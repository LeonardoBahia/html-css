<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="ícone-lb.ico" type="image/x-icon">
    <title>Imagem Flexível</title>
</head>
<body>
    <h1>Imagem Flexível</h1>
    <p>Você está vendo a imagem completa? Experimente ampliar o tamanho da sua janela para aproveitar a melhor experiência &#129327;</p>
    <picture>
        <source media="(max-width:750px)" srcset="imagens/golf-estreito.jpg" type="image/jpg">
        <source media="(max-width:1050px)" srcset="imagens/golf-media.jpg" type="image/jpg">
        <img src="imagens/golf-original.jpg" alt="Imagem Maior">
    </picture>
</body>
</html>
